[gcode_macro FLUSH]
description: empty purge bucket
gcode:
    {% if printer.toolhead.position.x|round(1) == 95.0 and printer.toolhead.position.y|round(1) == 324.0 %}
        G1 Y318 F9000
        G1 Y322 F600
        G1 Y318 F9000
        G1 Y322 F600
        G1 Y308 F30000
        G1 Y324 F600
    {% else %}
        RESPOND PREFIX="flush" MSG="Toolhead not parked at X95 Y324 – skipping flush."
    {% endif %}